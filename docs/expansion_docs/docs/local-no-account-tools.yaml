catalog_version: 1
scope:
  runtime: local-or-allowlisted-lan
  account_required: false
  api_key_required: false
  normal_operation_internet_required: false
  excluded:
    - hosted_saas
    - oauth_or_vendor_login
    - hosted_llm_or_embedding_api
    - public_web_search_or_fetch
    - token_required_integrations

integration_types:
  native_mcp: Already speaks MCP; mount or proxy after reviewing its tool surface.
  library_wrapper: Expose narrowly typed FastMCP functions over a local library.
  cli_wrapper: Call a fixed local executable with validated arguments; never use a shell string.
  local_api_wrapper: Call a localhost or static-LAN-allowlisted service only.

tools:
  - id: official-filesystem-mcp
    name: Official filesystem reference server
    repository: https://github.com/modelcontextprotocol/servers
    category: native-mcp
    license: Mixed; Apache-2.0 for new contributions, existing MIT code (review package)
    integration: native_mcp
    interface: stdio MCP
    no_account: true
    network: none
    os: [windows, linux, macos]
    priority: P0
    risk: high
    recommended_surface: Directory-scoped read/list/search tools; isolated mutation tools.
    guardrails: [canonical_allowed_roots, deny_symlink_escapes, read_only_default, approval_for_mutations]

  - id: official-git-mcp
    name: Official Git reference server
    repository: https://github.com/modelcontextprotocol/servers
    category: native-mcp
    license: Mixed; Apache-2.0 for new contributions, existing MIT code (review package)
    integration: native_mcp
    interface: Python package/stdio MCP (mcp-server-git)
    no_account: true
    network: none
    os: [windows, linux, macos]
    priority: P0
    risk: medium
    recommended_surface: Repository status, diff, log, blame, and read-only inspection.
    guardrails: [repository_allowlist, read_only_default, approval_for_commit_branch_or_push]

  - id: official-sqlite-mcp
    name: Official SQLite reference server
    repository: https://github.com/modelcontextprotocol/servers
    category: native-mcp
    license: Mixed; Apache-2.0 for new contributions, existing MIT code (review package)
    integration: native_mcp
    interface: stdio MCP
    no_account: true
    network: none
    os: [windows, linux, macos]
    priority: P0
    risk: high
    recommended_surface: Read-only query and schema inspection against approved databases.
    guardrails: [database_allowlist, sqlite_read_only_connections, sql_statement_allowlist]

  - id: duckdb
    name: DuckDB
    repository: https://github.com/duckdb/duckdb
    category: data-analysis
    license: MIT
    integration: library_wrapper
    interface: CLI and Python API
    no_account: true
    network: none
    os: [windows, linux, macos]
    priority: P0
    risk: medium
    recommended_surface: Profile datasets, compare schemas, aggregates, joins, and parameterized read-only SQL.
    guardrails: [allowed_data_roots, sql_statement_allowlist, no_extensions, bounded_result_size]

  - id: polars
    name: Polars
    repository: https://github.com/pola-rs/polars
    category: data-analysis
    license: MIT
    integration: library_wrapper
    interface: Python API
    no_account: true
    network: none
    os: [windows, linux, macos]
    priority: P0
    risk: medium
    recommended_surface: Typed DataFrame profile, comparison, join, grouping, and anomaly functions.
    guardrails: [allowed_data_roots, bounded_rows_columns, artifact_output_root]

  - id: pandas
    name: pandas
    repository: https://github.com/pandas-dev/pandas
    category: data-analysis
    license: BSD-3-Clause
    integration: library_wrapper
    interface: Python API
    no_account: true
    network: none
    os: [windows, linux, macos]
