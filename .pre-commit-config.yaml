# Lens A wiring: makes the adopted instruments run on every commit instead of depending on memory.
#
# One hook, deliberately: it calls scripts/infra-checks.ps1, which is also what mechanic-green runs.
# That keeps a single source of truth for how each tool is invoked (binary resolution, report paths,
# advisory-vs-blocking) instead of duplicating invocations in two places.
#
# Rationale: docs/LENS_A_LANDSCAPE.md section 8. Findings: docs/audits/2026-09-26-infra-adoption.md.
# Reports land in eve-audit/ (gitignored), so a hook run leaves evidence behind.
#
# The hook is advisory today: it reports and exit 0 unless scripts/infra-checks.ps1 -Strict is used.
# Bypass for a WIP commit with: git commit --no-verify
repos:
  - repo: local
    hooks:
      - id: empire-infra
        name: EMPIRE infra checks (deptry, ruff, gitleaks - advisory)
        entry: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/infra-checks.ps1
        language: system
        pass_filenames: false
        always_run: true
      # Keeps the Desktop copy of the LEGO blueprint in step with the canonical document, with rolling
      # backups, and warns when a structural inventory has changed since the document was last written.
      # Scoped: only fires when the blueprint or an inventory it summarises actually changes.
      - id: blueprint-sync
        name: LEGO blueprint -> Desktop (rolling backups)
        entry: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/sync-lego-blueprint.ps1
        language: system
        pass_filenames: false
        files: ^(docs/(LEGO_BLUEPRINT|LEGO_PROMPT|LEGO_CONTRACT|GEMINI_RESEARCH_BRIEF)\.md|config/(lego-bricks|capability-manifest|library|foundation)\.json)$
